<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dieta Pro - Planner Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .meta-gray { color: #9ca3af; } 
        .status-red { color: #ef4444; } 
        .status-yellow { color: #f59e0b; } 
        .status-green { color: #10b981; } 
        .status-orange { color: #f97316; } 
        .status-cyan { color: #06b6d4; } 
        
        /* Evita que as refeições sejam partidas entre páginas no PDF */
        .meal-card {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        #app-content.exporting {
            background-color: white !important;
            width: 100% !important;
            padding: 0 !important;
        }

        #app-content.exporting header {
            position: static !important;
            margin-bottom: 20px !important;
        }

        .no-print { display: block; }
        .exporting .no-print { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900 text-[14px]">

    <div id="app-content" class="max-w-4xl mx-auto p-4 pb-20">
        <header class="bg-white rounded-xl shadow-md p-6 mb-6 sticky top-0 z-10">
            <h1 class="text-2xl font-bold mb-4 border-b pb-2 text-center">Planejador de Dieta</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="dashboard-total"></div>
            
            <div class="mt-4 p-3 bg-gray-100 rounded-lg flex flex-wrap justify-between items-center gap-2">
                <div class="no-print">
                    <label class="text-sm font-semibold">Meta de Fibra (Adaptável):</label>
                    <input type="number" id="target-fiber" class="bg-transparent border-b border-gray-400 focus:outline-none w-16 px-2 text-center" value="25" onchange="updateUI()">
                </div>
                <div class="text-right">
                    <span class="text-sm">Fibras Totais: <span id="current-fiber" class="font-bold text-black text-lg">0g</span></span>
                </div>
            </div>
        </header>

        <div class="space-y-6" id="refeicoes-container"></div>

        <div class="mt-8 flex justify-center no-print">
            <button onclick="downloadPDF()" class="bg-black text-white px-8 py-3 rounded-full font-bold hover:bg-gray-800 transition-all flex items-center gap-2 shadow-lg">
                📥 Baixar Cardápio em PDF
            </button>
        </div>
    </div>

    <script>
        const FOODS = [
            { name: "🥚 Ovo cozido grande (58g)", kcal: 76, carb: 0.3, prot: 6.9, fat: 4.9, fib: 0 },
            { name: "🥚 Ovo cozido sem a gema", kcal: 18, carb: 0, prot: 4.2, fat: 0, fib: 0 },
            { name: "🥚🥚🧈 Dois ovos fritos na margarina", kcal: 121, carb: 0.3, prot: 13.8, fat: 9.9, fib: 0 },
            { name: "🧈 Margarina (10g - 1 colher)", kcal: 45, carb: 0, prot: 0, fat: 5, fib: 0 },
            { name: "🛢️ Óleo de soja (10ml - 1 colher)", kcal: 83, carb: 0, prot: 0, fat: 9.2, fib: 0 },
            { name: "🍚 Arroz cozido (100g)", kcal: 142, carb: 28.1, prot: 2.5, fat: 1.7, fib: 1.6 },
            { name: "🍚 Arroz cozido (150g)", kcal: 213, carb: 42.2, prot: 3.8, fat: 2.6, fib: 2.4 },
            { name: "🍲 Feijão cozido (100g)", kcal: 76, carb: 13.6, prot: 4.8, fat: 0.5, fib: 8.5 },
            { name: "🍲 Feijão c/ caldo carne (100g)", kcal: 85, carb: 13.6, prot: 4.8, fat: 1.5, fib: 8.5 },
            { name: "🍲 Feijão cozido (150g)", kcal: 114, carb: 20.4, prot: 7.2, fat: 0.8, fib: 12.8 },
            { name: "🍲 Feijão c/ caldo carne (150g)", kcal: 128, carb: 20.4, prot: 7.2, fat: 2.3, fib: 12.8 },
            { name: "🫓 Pão sovado (40g)", kcal: 124, carb: 24.6, prot: 3.4, fat: 1.1, fib: 1 },
            { name: "🍞 Pão francês inteiro (38g)", kcal: 114, carb: 22.3, prot: 3, fat: 1.2, fib: 0.9 },
            { name: "🍞 Pão francês sem miolo (22g)", kcal: 66, carb: 12.9, prot: 1.8, fat: 0.7, fib: 0.5 },
            { name: "🌾 Aveia (40g)", kcal: 148, carb: 23, prot: 5.6, fat: 3.1, fib: 2.7 },
            { name: "🌰 Granola São Braz Light (40g)", kcal: 147, carb: 29, prot: 3.7, fat: 2, fib: 3 },
            { name: "🌰 Granola Tradicional (40g)", kcal: 150, carb: 32, prot: 2.4, fat: 2.1, fib: 3.4 },
            { name: "🌰 Granola Bem Estar (40g)", kcal: 140, carb: 25, prot: 4.2, fat: 2.4, fib: 3 },
            { name: "🥣 Farinha láctea (30g)", kcal: 122, carb: 22, prot: 3.8, fat: 1.9, fib: 0 },
            { name: "🥣 Farinha láctea (15g)", kcal: 61, carb: 11, prot: 1.9, fat: 0.95, fib: 0 },
            { name: "🍙 Tapioca Lopes (68g)", kcal: 155, carb: 38.8, prot: 0, fat: 0, fib: 0.4 },
            { name: "🍙 Tapioca Lopes (115g)", kcal: 262, carb: 65.6, prot: 0, fat: 0, fib: 0.7 },
            { name: "🍙 Tapioca Parceria (68g)", kcal: 177, carb: 44.2, prot: 0, fat: 0, fib: 0 },
            { name: "🍙 Tapioca Parceria (115g)", kcal: 299, carb: 74.8, prot: 0, fat: 0, fib: 0 },
            { name: "🍙 Tapioca Kumê (68g)", kcal: 177, carb: 44.2, prot: 0, fat: 0, fib: 0 },
            { name: "🍙 Tapioca Kumê (115g)", kcal: 299, carb: 74.8, prot: 0, fat: 0, fib: 0 },
            { name: "🌽 Cuscuz Vitamilho CRU (50g)", kcal: 176, carb: 40, prot: 3.6, fat: 0.8, fib: 2.8 },
            { name: "🌽 Cuscuz Vitamilho CRU (100g)", kcal: 351, carb: 79, prot: 7.2, fat: 1.5, fib: 5.5 },
            { name: "🌽 Cuscuz Dona Clara CRU (50g)", kcal: 176, carb: 40, prot: 3.2, fat: 0.4, fib: 0.6 },
            { name: "🌽 Cuscuz Dona Clara CRU (100g)", kcal: 352, carb: 80, prot: 6.3, fat: 0.7, fib: 1.1 },
            { name: "🌽 Cuscuz Dona Clara COZIDO (50g)", kcal: 57, carb: 12.6, prot: 1.1, fat: 0.05, fib: 0.4 },
            { name: "🌽 Cuscuz Dona Clara COZIDO (100g)", kcal: 113, carb: 25.2, prot: 2.2, fat: 0.1, fib: 0.8 },
            { name: "🌽 Cuscuz Vitamilho COZIDO (50g)", kcal: 57, carb: 12.6, prot: 1.1, fat: 0.05, fib: 1.9 },
            { name: "🌽 Cuscuz Vitamilho COZIDO (100g)", kcal: 113, carb: 25.2, prot: 2.2, fat: 0.1, fib: 3.9 },
            { name: "🍌 Banana (70g)", kcal: 69, carb: 18.2, prot: 0.9, fat: 0.07, fib: 1 },
            { name: "🍌 Banana (100g)", kcal: 98, carb: 26, prot: 1.3, fat: 0.1, fib: 1.5 },
            { name: "🍌 Banana (150g)", kcal: 147, carb: 39, prot: 2, fat: 0.15, fib: 2.2 },
            { name: "🥛 Leite pó integral (13g)", kcal: 65, carb: 5, prot: 3.2, fat: 3.5, fib: 0 },
            { name: "🥛 Leite pó integral (26g)", kcal: 129, carb: 10, prot: 6.5, fat: 7, fib: 0 },
            { name: "🥛 Leite pó desnatado (13g)", kcal: 44, carb: 6.5, prot: 4.5, fat: 0, fib: 0 },
            { name: "🥛 Leite pó desnatado (26g)", kcal: 88, carb: 13, prot: 9, fat: 0, fib: 0 },
            { name: "🍖 Bisteca frita (55g)", kcal: 107, carb: 0, prot: 17.8, fat: 3.9, fib: 0 },
            { name: "🍖 Bisteca frita (64g)", kcal: 125, carb: 0, prot: 20.7, fat: 4.5, fib: 0 },
            { name: "🍗 Peito frango frito (60g)", kcal: 103, carb: 0, prot: 18.9, fat: 2.5, fib: 0 },
            { name: "🍗 Peito frango frito (70g)", kcal: 120, carb: 0, prot: 22, fat: 2.9, fib: 0 },
            { name: "🍗 Frango cozido refogado (60g)", kcal: 124, carb: 0, prot: 16.2, fat: 6.3, fib: 0 },
            { name: "🍗 Frango cozido refogado (70g)", kcal: 144, carb: 0, prot: 18.9, fat: 7.4, fib: 0 },
            { name: "🧀 Queijo coalho irmã (30g)", kcal: 96, carb: 1.1, prot: 6.4, fat: 7.4, fib: 0 },
            { name: "🧀 Queijo coalho Medeiros (21g)", kcal: 67, carb: 0.8, prot: 5.2, fat: 6.09, fib: 0 }
        ];

        let meals = [
            { id: 0, name: "🍳 Café da Manhã", target: { prot: 28, carb: 40, fat: 14, kcal: 398 }, selectedFoods: [] },
            { id: 1, name: "🍛 Almoço", target: { prot: 32, carb: 55, fat: 18, kcal: 506 }, selectedFoods: [] },
            { id: 2, name: "☕ Lanche da Tarde", target: { prot: 30, carb: 50, fat: 7, kcal: 387 }, selectedFoods: [] },
            { id: 3, name: "🌙 Jantar", target: { prot: 28, carb: 30, fat: 20, kcal: 409 }, selectedFoods: [] }
        ];

        const LIMITS = {
            prot: { min: 95, ideal: 118, max: 130 },
            fat: { min: 47, ideal: 59, max: 70 },
            carb: { min: 150, ideal: 175, max: 200 },
            kcal: { min: 1600, ideal: 1700, max: 1800 }
        };

        function getColorClass(val, lim) {
            if (val < lim.min) return 'status-red';
            if (val === lim.min) return 'status-yellow';
            if (val <= lim.ideal) return 'status-green';
            if (val <= lim.max) return 'status-orange';
            return 'status-cyan';
        }

        function updateUI() {
            let tot = { prot: 0, carb: 0, fat: 0, kcal: 0, fib: 0 };
            meals.forEach(m => m.selectedFoods.forEach(f => {
                tot.prot += f.prot; tot.carb += f.carb; tot.fat += f.fat; tot.kcal += f.kcal; tot.fib += (f.fib || 0);
            }));

            const dash = document.getElementById('dashboard-total');
            dash.innerHTML = ['prot', 'fat', 'carb', 'kcal'].map(k => {
                const labels = { prot: 'Proteína', fat: 'Gordura', carb: 'Carboidrato', kcal: 'Calorias' };
                const color = getColorClass(tot[k], LIMITS[k]);
                return `
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold uppercase text-gray-400">${labels[k]}</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-xl font-black">${Math.round(tot[k])}</span>
                            <span class="text-xs meta-gray">/ ${LIMITS[k].ideal}</span>
                        </div>
                        <div class="h-1.5 w-full bg-gray-200 mt-1 rounded-full overflow-hidden">
                            <div class="h-full bg-current ${color}" style="width: ${Math.min((tot[k]/LIMITS[k].max)*100, 100)}%"></div>
                        </div>
                    </div>`;
            }).join('');

            document.getElementById('current-fiber').innerText = `${tot.fib.toFixed(1)}g`;
            renderMeals();
        }

        function renderMeals() {
            const container = document.getElementById('refeicoes-container');
            container.innerHTML = '';
            let diff = { prot: 0, carb: 0, fat: 0, kcal: 0 };

            meals.forEach((meal, idx) => {
                const curr = meal.selectedFoods.reduce((a, f) => {
                    a.p += f.prot; a.c += f.carb; a.g += f.fat; a.k += f.kcal; a.f += (f.fib || 0); return a;
                }, { p: 0, c: 0, g: 0, k: 0, f: 0 });

                const adj = {
                    p: meal.target.prot + diff.prot,
                    c: meal.target.carb + diff.carb,
                    g: meal.target.fat + diff.fat,
                    k: meal.target.kcal + diff.kcal
                };

                const rem = meals.length - (idx + 1);
                if (rem > 0) {
                    diff.prot = (adj.p - curr.p) / rem; diff.carb = (adj.c - curr.c) / rem;
                    diff.fat = (adj.g - curr.g) / rem; diff.kcal = (adj.k - curr.k) / rem;
                }

                const div = document.createElement('div');
                div.className = "meal-card bg-white rounded-xl shadow p-5 border-l-8 border-black";
                div.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between mb-4 border-b pb-2">
                        <h2 class="text-lg font-bold">${meal.name}</h2>
                        <div class="text-right">
                            <p class="text-[10px] text-black font-bold uppercase">META: P:${Math.round(adj.p)}g C:${Math.round(adj.c)}g G:${Math.round(adj.g)}g | ${Math.round(adj.k)}kcal</p>
                            <p class="text-xs ${curr.p >= adj.p ? 'text-black font-bold' : 'meta-gray'} uppercase font-bold">OBTIDO: P:${curr.p.toFixed(1)} C:${curr.c.toFixed(1)} G:${curr.g.toFixed(1)} | F: ${curr.f.toFixed(1)}g</p>
                        </div>
                    </div>
                    <div class="space-y-2 mb-4">
                        ${meal.selectedFoods.map((f, i) => `
                            <div class="flex justify-between items-center bg-gray-50 p-2 px-3 rounded text-sm">
                                <div><span class="block font-medium">${f.name}</span><span class="text-[10px] text-gray-500 block uppercase">P: ${f.prot}g | C: ${f.carb}g | G: ${f.fat}g | F: ${f.fib}g</span></div>
                                <button onclick="removeFood(${idx}, ${i})" class="text-red-400 p-1 no-print">✕</button>
                            </div>`).join('')}
                    </div>
                    <div class="no-print">
                        <select onchange="addFood(${idx}, this)" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm">
                            <option value="">+ Adicionar Alimento...</option>
                            ${FOODS.map((f, i) => `<option value="${i}">${f.name}</option>`).join('')}
                        </select>
                    </div>`;
                container.appendChild(div);
            });
        }

        function addFood(mIdx, sel) { if(sel.value !== "") { meals[mIdx].selectedFoods.push({...FOODS[sel.value]}); updateUI(); } }
        function removeFood(mIdx, fIdx) { meals[mIdx].selectedFoods.splice(fIdx, 1); updateUI(); }

        function downloadPDF() {
            const element = document.getElementById('app-content');
            element.classList.add('exporting');

            const opt = { 
                margin: [10, 5, 10, 5], 
                filename: 'dieta.pdf', 
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 2, 
                    useCORS: true, 
                    letterRendering: true,
                    scrollY: -window.scrollY // Corrige o espaço em branco no topo
                }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'css', before: '.meal-card' } // Força a quebra inteligente
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('exporting');
                updateUI();
            });
        }

        updateUI();
    </script>
</body>
</html>
