<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dieta Profissional</title>
    <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe2ea;
      --primary: #0f172a;
      --below: #dc2626;
      --min: #eab308;
      --ideal: #16a34a;
      --max: #f97316;
      --above: #06b6d4;
      --soft: #f8fafc;
    }* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.05);
}
.hero {
  padding: 24px;
  margin-bottom: 18px;
}
.hero h1 {
  margin: 0 0 8px;
  font-size: 32px;
}
.hero p {
  margin: 0;
  color: var(--muted);
  line-height: 1.5;
}
.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: end;
  margin-top: 18px;
}
.field label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}
.field input, .field select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 15px;
  background: #fff;
}
.btn {
  border: 0;
  background: var(--primary);
  color: #fff;
  padding: 12px 16px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 700;
}
.btn.secondary {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.metric-card {
  padding: 18px;
}
.metric-card .title {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 8px;
}
.metric-card .value {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 10px;
}
.metric-card .range {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.below { color: var(--below); }
.min { color: var(--min); }
.ideal { color: var(--ideal); }
.max { color: var(--max); }
.above { color: var(--above); }
.met-black { color: #000; }
.met-gray { color: #94a3b8; }
.main-grid {
  display: grid;
  grid-template-columns: 370px 1fr;
  gap: 18px;
  align-items: start;
}
.sidebar, .summary {
  padding: 18px;
}
.sidebar h2, .summary h2 {
  margin: 0 0 14px;
  font-size: 22px;
}
.meal-selector {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.meal-selector button {
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-weight: 700;
  text-align: left;
}
.meal-selector button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.food-list {
  max-height: 620px;
  overflow: auto;
  margin-top: 14px;
  padding-right: 4px;
}
.food-item {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 10px;
  background: #fff;
}
.food-item-name {
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 6px;
}
.food-item-meta {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 10px;
}
.meals-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.meal-card {
  padding: 18px;
}
.meal-card h3 {
  margin: 0 0 14px;
  font-size: 23px;
}
.meal-subtitle {
  color: var(--muted);
  font-size: 14px;
  font-weight: 400;
}
.meal-targets {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.target-box {
  background: var(--soft);
  border-radius: 14px;
  padding: 12px;
}
.target-box .label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 4px;
}
.target-box .goal {
  color: #000;
  font-weight: 800;
  font-size: 15px;
}
.target-box .actual {
  font-weight: 800;
  font-size: 15px;
  margin-top: 4px;
}
.meal-total {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  line-height: 1.7;
}
.meal-items .added-item {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  align-items: start;
}
.added-item .meta {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-top: 6px;
}
.empty {
  border: 1px dashed var(--border);
  border-radius: 14px;
  padding: 14px;
  color: var(--muted);
  font-size: 14px;
}
.summary { margin-top: 18px; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}
.summary-box {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
}
.summary-box .title {
  color: var(--muted);
  font-size: 14px;
}
.summary-box .value {
  margin-top: 6px;
  font-size: 24px;
  font-weight: 800;
}
@media (max-width: 1100px) {
  .metrics-grid, .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main-grid { grid-template-columns: 1fr; }
  .meals-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .metrics-grid, .summary-grid, .meal-targets, .meal-selector { grid-template-columns: 1fr; }
  .hero h1 { font-size: 26px; }
}

@media print {
  body {
    background: #fff;
    color: #000;
  }
  .container {
    max-width: 100%;
    padding: 0;
  }
  .card {
    box-shadow: none;
    border: 1px solid #ddd;
    break-inside: avoid;
  }
  .hero-actions,
  .sidebar,
  .btn,
  .btn.secondary {
    display: none !important;
  }
  .main-grid,
  .meals-grid,
  .metrics-grid,
  .summary-grid {
    display: block;
  }
  .metric-card,
  .summary-box,
  .meal-card,
  .summary,
  .hero {
    margin-bottom: 12px;
  }
  .food-list,
  .meal-items,
  .meal-total,
  .meal-targets {
    overflow: visible;
  }
  .meal-card,
  .summary,
  .hero,
  .metric-card {
    page-break-inside: avoid;
  }
}

      { id: "frango-frito-70", name: "🍗 Peito de frango frito no óleo (70g)", calories: 120, carbs: 0, protein: 22, fat: 2.9, fiber: 0 },
      { id: "frango-refogado-60", name: "🍗 Frango cozido refogado (60g)", calories: 124, carbs: 0, protein: 16.2, fat: 6.3, fiber: 0 },

    const DAILY_TARGETS = {
      protein: { min: 95, ideal: 118, max: 130, label: "Proteína", unit: "g" },
      fat: { min: 47, ideal: 59, max: 70, label: "Gordura", unit: "g" },
      carbs: { min: 150, ideal: 175, max: 200, label: "Carboidrato", unit: "g" },
      calories: { min: 1600, ideal: 1700, max: 1800, label: "Calorias", unit: "kcal" },
    };

    const MEALS = [
      { id: "cafe", name: "🍳 Café da manhã", targets: { protein: 28, carbs: 40, fat: 14, calories: 398 } },
      { id: "almoco", name: "🍛 Almoço", targets: { protein: 32, carbs: 55, fat: 18, calories: 506 } },
      { id: "lanche", name: "☕ Lanche da tarde", subtitle: "(pré/pós treino)", targets: { protein: 30, carbs: 50, fat: 7, calories: 387 } },
      { id: "janta", name: "🌙 Jantar", subtitle: "(leve)", targets: { protein: 28, carbs: 30, fat: 20, calories: 409 } },
    ];

    const state = {
      selectedMeal: "cafe",
      search: "",
      fiberGoal: 25,
      mealItems: {
        cafe: [],
        almoco: [],
        lanche: [],
        janta: [],
      }
    };

    function round1(value) {
      return Math.round((value + Number.EPSILON) * 10) / 10;
    }

    function sumMeal(items) {
      return items.reduce((acc, item) => ({
        calories: acc.calories + item.calories,
        carbs: acc.carbs + item.carbs,
        protein: acc.protein + item.protein,
        fat: acc.fat + item.fat,
        fiber: acc.fiber + item.fiber,
      }), { calories: 0, carbs: 0, protein: 0, fat: 0, fiber: 0 });
    }

    function getTotalStatus(value, target) {
      const v = round1(value);
      const min = round1(target.min);
      const ideal = round1(target.ideal);
      const max = round1(target.max);

      if (v < min) return "below";
      if (v >= min && v < ideal) return "min";
      if (v === ideal) return "ideal";
      if (v > ideal && v <= max) return "max";
      return "above";
    }

    function distributeDelta(delta, futureIndexes, allocations) {
      if (!futureIndexes.length || delta === 0) return allocations;
      const sign = delta > 0 ? 1 : -1;
      let remaining = Math.abs(Math.round(delta));
      let pointer = 0;
      while (remaining > 0 && futureIndexes.length > 0) {
        const idx = futureIndexes[pointer % futureIndexes.length];
        allocations[idx] += sign;
        remaining -= 1;
        pointer += 1;
      }
      return allocations;
    }

    function calculateAdjustedTargets(mealSummaries) {
      const adjusted = MEALS.map(meal => ({ id: meal.id, name: meal.name, targets: { ...meal.targets } }));
      ["protein", "carbs", "fat", "calories"].forEach(metric => {
        const allocations = new Array(MEALS.length).fill(0);
        for (let i = 0; i < MEALS.length - 1; i += 1) {
          const currentTarget = MEALS[i].targets[metric] + allocations[i];
          adjusted[i].targets[metric] = Math.max(0, round1(currentTarget));
          const consumed = mealSummaries[i][metric];
          const delta = round1(currentTarget - consumed);
          const futureIndexes = [];
          for (let j = i + 1; j < MEALS.length; j += 1) futureIndexes.push(j);
          distributeDelta(delta, futureIndexes, allocations);
        }
        const lastIndex = MEALS.length - 1;
        adjusted[lastIndex].targets[metric] = Math.max(0, round1(MEALS[lastIndex].targets[metric] + allocations[lastIndex]));
      });
      return adjusted;
    }

    function getMealSummaries() {
      return MEALS.map(meal => sumMeal(state.mealItems[meal.id]));
    }

    function getTotalDay() {
      const mealSummaries = getMealSummaries();
      return mealSummaries.reduce((acc, meal) => ({
        calories: round1(acc.calories + meal.calories),
        carbs: round1(acc.carbs + meal.carbs),
        protein: round1(acc.protein + meal.protein),
        fat: round1(acc.fat + meal.fat),
        fiber: round1(acc.fiber + meal.fiber),
      }), { calories: 0, carbs: 0, protein: 0, fat: 0, fiber: 0 });
    }

    function renderTopMetrics() {
      const totalDay = getTotalDay();
      const fiberGoal = Number(state.fiberGoal) || 0;
      const fiberStatus = totalDay.fiber >= fiberGoal ? "ideal" : "below";
      const metrics = [
        ["protein", DAILY_TARGETS.protein],
        ["fat", DAILY_TARGETS.fat],
        ["carbs", DAILY_TARGETS.carbs],
        ["calories", DAILY_TARGETS.calories],
      ];

      const html = metrics.map(([key, target]) => {
        const status = getTotalStatus(totalDay[key], target);
        return `
          <div class="card metric-card">
            <div class="title">${target.label}</div>
            <div class="value ${status}">${round1(totalDay[key])} ${target.unit}</div>
            <div class="range">Mín ${target.min} • Ideal ${target.ideal} • Máx ${target.max}</div>
          </div>
        `;
      }).join("") + `
        <div class="card metric-card">
          <div class="title">Fibra</div>
          <div class="value ${fiberStatus}">${round1(totalDay.fiber)} g</div>
          <div class="range">Meta adaptável: ${fiberGoal}g • ${totalDay.fiber >= fiberGoal ? "Meta batida" : `Faltam ${round1(Math.max(0, fiberGoal - totalDay.fiber))}g`}</div>
        </div>
      `;

      document.getElementById("topMetrics").innerHTML = html;
