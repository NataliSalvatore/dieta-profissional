<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Dieta Personalizada</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --vermelho: #ff4d4d; --amarelo: #ffdb4d; --verde: #4dff88;
            --laranja: #ffa64d; --ciano: #4dffff; --cinza: #a0a0a0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px; padding: 20px; border-radius: 12px; background: #fff; border: 1px solid #e0e0e0; }
        .stat-card { text-align: center; }
        .stat-label { font-size: 0.85em; color: #666; font-weight: bold; text-transform: uppercase; }
        .stat-value { font-size: 1.5em; font-weight: 800; margin-top: 5px; }
        
        .refeicao-container { margin-bottom: 20px; border: 1px solid #e0e0e0; padding: 18px; border-radius: 10px; background: #fafafa; }
        .refeicao-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 12px; padding-bottom: 8px; }
        .meta-info { font-size: 0.9em; color: #444; }
        .atual-info { font-size: 0.95em; margin: 10px 0; font-weight: 600; }
        .falta { color: var(--cinza) !important; font-weight: normal; }

        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: white; margin-top: 10px; }
        .lista-alimentos { list-style: none; padding: 0; margin: 10px 0; }
        .item-alimento { display: flex; justify-content: space-between; padding: 8px 12px; background: white; border: 1px solid #eee; margin-bottom: 5px; border-radius: 6px; font-size: 0.9em; align-items: center; }
        .remove-btn { color: #ff4d4d; cursor: pointer; font-weight: bold; padding: 5px; }

        .btn-pdf { background: #1a73e8; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-pdf:hover { background: #1557b0; }
        
        .fibra-box { text-align: center; margin-bottom: 20px; background: #e8f0fe; padding: 10px; border-radius: 8px; }
        .fibra-input { width: 50px; padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Minha Dieta GitHub</h1>

    <div class="dashboard" id="total-dashboard"></div>

    <div class="fibra-box">
        <label>Meta de Fibra Adaptável: </label>
        <input type="number" id="meta-fibra-input" class="fibra-input" value="25" onchange="render()"> g
    </div>

    <div id="refeicoes-lista"></div>

    <button class="btn-pdf" onclick="gerarPDF()">📥 Baixar Cardápio em PDF</button>
</div>

<script>
    const alimentos = [
        { n: "🥚 Ovo cozido grande (58g)", kcal: 76, c: 0.3, p: 6.9, g: 4.9, f: 0 },
        { n: "🥚 Ovo cozido sem a gema", kcal: 18, c: 0, p: 4.2, g: 0, f: 0 },
        { n: "🥚🥚🧈 2 ovos fritos na margarina", kcal: 121, c: 0.3, p: 13.8, g: 9.9, f: 0 },
        { n: "🧈 Margarina (10g - 1 colher)", kcal: 45, c: 0, p: 0, g: 5, f: 0 },
        { n: "🛢️ Óleo de soja (10 ml)", kcal: 83, c: 0, p: 0, g: 9.2, f: 0 },
        { n: "🍚 Arroz cozido (100g)", kcal: 142, c: 28.1, p: 2.5, g: 1.7, f: 1.6 },
        { n: "🍚 Arroz cozido (150g)", kcal: 213, c: 42.2, p: 3.8, g: 2.6, f: 2.4 },
        { n: "🍲 Feijão cozido (100g)", kcal: 76, c: 13.6, p: 4.8, g: 0.5, f: 8.5 },
        { n: "🍲 Feijão cozido c/ caldo carne (100g)", kcal: 85, c: 13.6, p: 4.8, g: 1.5, f: 8.5 },
        { n: "🍲 Feijão cozido (150g)", kcal: 114, c: 20.4, p: 7.2, g: 0.8, f: 12.8 },
        { n: "🍲 Feijão cozido c/ caldo carne (150g)", kcal: 128, c: 20.4, p: 7.2, g: 2.3, f: 12.8 },
        { n: "🫓 Pão sovado (40g)", kcal: 124, c: 24.6, p: 3.4, g: 1.1, f: 1 },
        { n: "🍞 Pão francês inteiro (38g)", kcal: 114, c: 22.3, p: 3, g: 1.2, f: 0.9 },
        { n: "🍞 Pão francês sem miolo (22g)", kcal: 66, c: 12.9, p: 1.8, g: 0.7, f: 0.5 },
        { n: "🌾 Aveia (40g - 4 colheres)", kcal: 148, c: 23, p: 5.6, g: 3.1, f: 2.7 },
        { n: "🌰 Granola São Braz Light (40g)", kcal: 147, c: 29, p: 3.7, g: 2, f: 3 },
        { n: "🌰 Granola São Braz Tradicional (40g)", kcal: 150, c: 32, p: 2.4, g: 2.1, f: 3.4 },
        { n: "🌰 Granola Bem Estar (40g)", kcal: 140, c: 25, p: 4.2, g: 2.4, f: 3 },
        { n: "🥣 Farinha láctea (30g - 4 colheres)", kcal: 122, c: 22, p: 3.8, g: 1.9, f: 0 },
        { n: "🥣 Farinha láctea (15g - 2 colheres)", kcal: 61, c: 11, p: 1.9, g: 0.95, f: 0 },
        { n: "🍙 Tapioca pequena Lopes (68g)", kcal: 155, c: 38.8, p: 0, g: 0, f: 0.4 },
        { n: "🍙 Tapioca grande Lopes (115g)", kcal: 262, c: 65.6, p: 0, g: 0, f: 0.7 },
        { n: "🍙 Tapioca pequena Parceria (68g)", kcal: 177, c: 44.2, p: 0, g: 0, f: 0 },
        { n: "🍙 Tapioca grande Parceria (115g)", kcal: 299, c: 74.8, p: 0, g: 0, f: 0 },
        { n: "🍙 Tapioca pequena Kumê (68g)", kcal: 177, c: 44.2, p: 0, g: 0, f: 0 },
        { n: "🍙 Tapioca grande Kumê (115g)", kcal: 299, c: 74.8, p: 0, g: 0, f: 0 },
        { n: "🌽 Cuscuz Vitamilho CRU (50g)", kcal: 176, c: 40, p: 3.6, g: 0.8, f: 2.8 },
        { n: "🌽 Cuscuz Vitamilho CRU (100g)", kcal: 351, c: 79, p: 7.2, g: 1.5, f: 5.5 },
        { n: "🌽 Cuscuz Dona Clara CRU (50g)", kcal: 176, c: 40, p: 3.2, g: 0.4, f: 0.6 },
        { n: "🌽 Cuscuz Dona Clara CRU (100g)", kcal: 352, c: 80, p: 6.3, g: 0.7, f: 1.1 },
        { n: "🌽 Cuscuz Dona Clara COZIDO (50g)", kcal: 57, c: 12.6, p: 1.1, g: 0.05, f: 0.4 },
        { n: "🌽 Cuscuz Dona Clara COZIDO (100g)", kcal: 113, c: 25.2, p: 2.2, g: 0.1, f: 0.8 },
        { n: "🌽 Cuscuz Vitamilho COZIDO (50g)", kcal: 57, c: 12.6, p: 1.1, g: 0.05, f: 1.9 },
        { n: "🌽 Cuscuz Vitamilho COZIDO (100g)", kcal: 113, c: 25.2, p: 2.2, g: 0.1, f: 3.9 },
        { n: "🍌 Banana (70g)", kcal: 69, c: 18.2, p: 0.9, g: 0.07, f: 1.4 },
        { n: "🍌 Banana (100g)", kcal: 98, c: 26, p: 1.3, g: 0.1, f: 2 },
        { n: "🍌 Banana (150g)", kcal: 147, c: 39, p: 2, g: 0.15, f: 3 },
        { n: "🥛 Leite em pó integral (13g)", kcal: 65, c: 5, p: 3.2, g: 3.5, f: 0 },
        { n: "🥛 Leite em pó desnatado (13g)", kcal: 44, c: 6.5, p: 4.5, g: 0, f: 0 },
        { n: "🥛 Leite em pó desnatado (26g)", kcal: 88, c: 13, p: 9, g: 0, f: 0 },
        { n: "🥛 Leite em pó integral (26g)", kcal: 129, c: 10, p: 6.5, g: 7, f: 0 },
        { n: "🍖 Bisteca magra frita óleo (55g consumido)", kcal: 107, c: 0, p: 17.8, g: 3.9, f: 0 },
        { n: "🍖 Bisteca magra frita óleo (64g consumido)", kcal: 125, c: 0, p: 20.7, g: 4.5, f: 0 },
        { n: "🍗 Peito de frango frito no óleo (60g)", kcal: 103, c: 0, p: 18.9, g: 2.5, f: 0 },
        { n: "🍗 Peito de frango frito no óleo (70g)", kcal: 120, c: 0, p: 22, g: 2.9, f: 0 },
        { n: "🍗 Frango cozido refogado (60g)", kcal: 124, c: 0, p: 16.2, g: 6.3, f: 0 },
        { n: "🍗 Frango cozido refogado (70g)", kcal: 144, c: 0, p: 18.9, g: 7.4, f: 0 },
        { n: "🧀 Queijo coalho da irmã (30g)", kcal: 96, c: 1.1, p: 6.4, g: 7.4, f: 0 },
        { n: "🧀 Queijo coalho do Medeiros (21g)", kcal: 67, c: 0.8, p: 5.2, g: 6.09, f: 0 }
    ];

    const metasGlobais = {
        p: { min: 95, ideal: 118, max: 130 },
        g: { min: 47, ideal: 59, max: 70 },
        c: { min: 150, ideal: 175, max: 200 },
        kcal: { min: 1600, ideal: 1700, max: 1800 }
    };

    let refeicoes = [
        { id: 0, nome: "🍳 Café da manhã", base: {p:28, c:40, g:14, kcal:398}, itens: [] },
        { id: 1, nome: "🍛 Almoço", base: {p:32, c:55, g:18, kcal:506}, itens: [] },
        { id: 2, nome: "☕ Lanche da tarde", base: {p:30, c:50, g:7, kcal:387}, itens: [] },
        { id: 3, nome: "🌙 Jantar", base: {p:28, c:30, g:20, kcal:409}, itens: [] }
    ];

    function getColor(val, meta) {
        if (val < meta.min) return "var(--vermelho)";
        if (val >= meta.min && val < meta.ideal) return "var(--amarelo)";
        if (val >= meta.ideal && val < meta.max) return "var(--verde)";
        if (val >= meta.max && val <= meta.max + 2) return "var(--laranja)"; 
        return "var(--ciano)";
    }

    function addAlimento(refId, index) {
        if(index === "") return;
        refeicoes[refId].itens.push({...alimentos[index]});
        render();
    }

    function removeAlimento(refId, itemIndex) {
        refeicoes[refId].itens.splice(itemIndex, 1);
        render();
    }

    function render() {
        const dashboard = document.getElementById('total-dashboard');
        const lista = document.getElementById('refeicoes-lista');
        const metaFibra = parseFloat(document.getElementById('meta-fibra-input').value) || 0;

        let total = { p: 0, c: 0, g: 0, kcal: 0, f: 0 };
        let metasDinamicas = refeicoes.map(r => ({...r.base}));

        for(let i=0; i < 4; i++) {
            let somaRef = { p: 0, c: 0, g: 0, kcal: 0, f: 0 };
            refeicoes[i].itens.forEach(it => {
                somaRef.p += it.p; somaRef.c += it.c; somaRef.g += it.g; somaRef.kcal += it.kcal; somaRef.f += (it.f || 0);
                total.p += it.p; total.c += it.c; total.g += it.g; total.kcal += it.kcal; total.f += (it.f || 0);
            });
            refeicoes[i].atual = somaRef;

            let diffP = metasDinamicas[i].p - somaRef.p;
            let diffC = metasDinamicas[i].c - somaRef.c;
            let diffG = metasDinamicas[i].g - somaRef.g;
            
            let restantes = 3 - i;
            if(restantes > 0) {
                for(let j = i+1; j < 4; j++) {
                    metasDinamicas[j].p += diffP / restantes;
                    metasDinamicas[j].c += diffC / restantes;
                    metasDinamicas[j].g += diffG / restantes;
                }
            }
        }

        const stats = [
            { label: "Proteína", val: total.p, meta: metasGlobais.p, unit: "g" },
            { label: "Carbo", val: total.c, meta: metasGlobais.c, unit: "g" },
            { label: "Gordura", val: total.g, meta: metasGlobais.g, unit: "g" },
            { label: "Calorias", val: total.kcal, meta: metasGlobais.kcal, unit: "kcal" },
            { label: "Fibras", val: total.f, meta: {min: metaFibra, ideal: metaFibra, max: metaFibra+5}, unit: "g" }
        ];

        dashboard.innerHTML = stats.map(s => `
            <div class="stat-card">
                <div class="stat-label">${s.label}</div>
                <div class="stat-value" style="color: ${getColor(s.val, s.meta)}">${s.val.toFixed(1)}${s.unit}</div>
            </div>
        `).join('');

        lista.innerHTML = refeicoes.map((ref, i) => `
            <div class="refeicao-container">
                <div class="refeicao-header">
                    <strong>${ref.nome}</strong>
                    <div class="meta-info">Meta: P ${metasDinamicas[i].p.toFixed(1)}g | C ${metasDinamicas[i].c.toFixed(1)}g | G ${metasDinamicas[i].g.toFixed(1)}g</div>
                </div>
                <div class="atual-info">
                    Obtido: 
                    <span class="${ref.atual.p < metasDinamicas[i].p - 0.1 ? 'falta' : ''}">P: ${ref.atual.p.toFixed(1)}g</span> | 
                    <span class="${ref.atual.c < metasDinamicas[i].c - 0.1 ? 'falta' : ''}">C: ${ref.atual.c.toFixed(1)}g</span> | 
                    <span class="${ref.atual.g < metasDinamicas[i].g - 0.1 ? 'falta' : ''}">G: ${ref.atual.g.toFixed(1)}g</span>
                </div>
                <ul class="lista-alimentos">
                    ${ref.itens.map((it, idx) => `
                        <li class="item-alimento">
                            <span>${it.n} <small>(P:${it.p} C:${it.c} G:${it.g})</small></span>
                            <span class="remove-btn" onclick="removeAlimento(${i}, ${idx})">Remover</span>
                        </li>
                    `).join('')}
                </ul>
                <select onchange="addAlimento(${i}, this.value); this.value='';">
                    <option value="">🔍 Selecione um alimento para adicionar...</option>
                    ${alimentos.map((a, idx) => `<option value="${idx}">${a.n}</option>`).join('')}
                </select>
            </div>
        `).join('');
    }

    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 20;
        doc.setFontSize(18);
        doc.text("Meu Cardápio Diário", 20, y);
        y += 15;

        refeicoes.forEach(ref => {
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text(ref.nome, 20, y);
            y += 7;
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            ref.itens.forEach(it => {
                doc.text(`- ${it.n}: P:${it.p}g | C:${it.c}g | G:${it.g}g | ${it.kcal}kcal`, 25, y);
                y += 6;
                if(y > 280) { doc.addPage(); y = 20; }
            });
            y += 5;
        });

        doc.save("minha-dieta.pdf");
    }

    render();
</script>
</body>
</html>
